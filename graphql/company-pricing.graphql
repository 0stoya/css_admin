query AdminCompanyPricingStatus($companyId: Int!) {
  css_admin_company_pricing_status(company_id: $companyId) {
    company_id
    cref
    company_active
    sync_enabled
    has_custom_prices
    custom_price_count
    import_status
    import_percentage
    status_message
    last_imported_at
    currency
  }
}

query AdminCompanyPrices(
  $companyId: Int!
  $currentPage: Int = 1
  $pageSize: Int = 20
  $search: String
) {
  css_admin_company_prices(
    company_id: $companyId
    currentPage: $currentPage
    pageSize: $pageSize
    search: $search
  ) {
    total_count
    items {
      sku
      product_id
      product_name
      price
      tier_prices {
        quantity
        price
      }
    }
    page_info {
      page_size
      current_page
      total_pages
    }
  }
}
