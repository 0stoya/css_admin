# Customer-token company management portal acceptance.
# Use a Magento customer bearer token, not an admin token.

query CompanyPortalContext {
  css_company_context {
    authenticated
    customer_id
    selected_company_id
    selected_company_user_id
    is_company_customer
    is_personal_context
    companies {
      company_id
      company_user_id
      name
      reference
      active
      selected
    }
  }
}

query CompanyPortalAdministration {
  css_company_admin {
    company_id
    company_user_id
    is_company_admin
    can_view_users
    can_manage_users
    can_view_roles
    can_manage_roles
    can_manage_catalog_visibility
    can_view_purchase_controls
    can_manage_purchase_controls
    users {
      user_id
      customer_id
      firstname
      lastname
      email
      is_company_admin
      manager_user_id
      approval_type
      approval_threshold
      can_checkout
      can_approve_credit_orders
      can_auto_approve_credit_order
      roles { role_id name manageable }
    }
    roles {
      role_id
      name
      sort_order
      allowed_resources
      user_count
      manageable
    }
    control_roles {
      role_id
      name
      sort_order
    }
    resources {
      resource_id
      title
      parent_resource_id
      depth
      assignable
    }
  }
}

mutation CompanyPortalSelectCompany($companyId: Int!) {
  cssSelectCompany(company_id: $companyId) {
    selected_company_id
    selected_company_user_id
    companies { company_id name reference selected }
  }
}

mutation CompanyPortalCreateRole($name: String!, $sortOrder: Int, $allowedResources: [String!]!) {
  cssSaveCompanyRole(input: {
    name: $name
    sort_order: $sortOrder
    allowed_resources: $allowedResources
  }) {
    role_id
    name
    sort_order
    allowed_resources
    user_count
    manageable
  }
}

mutation CompanyPortalUpdateRole($roleId: Int!, $name: String!, $sortOrder: Int, $allowedResources: [String!]!) {
  cssSaveCompanyRole(input: {
    role_id: $roleId
    name: $name
    sort_order: $sortOrder
    allowed_resources: $allowedResources
  }) {
    role_id
    name
    sort_order
    allowed_resources
    user_count
    manageable
  }
}

mutation CompanyPortalDeleteRole($roleId: Int!) {
  cssDeleteCompanyRole(role_id: $roleId)
}

mutation CompanyPortalUpdateUser(
  $userId: Int!
  $roleId: Int!
  $managerId: Int
  $approvalType: String
  $approvalThreshold: Float
) {
  cssUpdateCompanyUser(input: {
    user_id: $userId
    role_id: $roleId
    manager_id: $managerId
    approval_type: $approvalType
    approval_threshold: $approvalThreshold
  }) {
    user_id
    email
    manager_user_id
    approval_type
    approval_threshold
    roles { role_id name }
  }
}

mutation CompanyPortalRemoveUser($userId: Int!) {
  cssRemoveCompanyUser(user_id: $userId)
}
