# Company Management read/write contract from Css/Commerce/etc/schema.graphqls.

query AdminCompanyManagement($companyId: Int!) {
  css_admin_company_management(company_id: $companyId) {
    company_id
    users {
      user_id
      customer_id
      firstname
      lastname
      email
      is_company_admin
      manager_user_id
      approval_type
      approval_threshold
      can_checkout
      can_approve_credit_orders
      can_auto_approve_credit_order
      roles {
        role_id
        name
        manageable
      }
    }
    roles {
      role_id
      name
      sort_order
      allowed_resources
      user_count
      manageable
    }
    resources {
      resource_id
      title
      parent_resource_id
      depth
      assignable
    }
  }
}

query AdminCompanyCustomerCandidates(
  $companyId: Int!
  $currentPage: Int!
  $pageSize: Int!
  $search: String
) {
  css_admin_company_customer_candidates(
    company_id: $companyId
    currentPage: $currentPage
    pageSize: $pageSize
    search: $search
  ) {
    total_count
    items {
      customer_id
      website_id
      firstname
      lastname
      email
      assigned_to_company
    }
    page_info {
      page_size
      current_page
      total_pages
    }
  }
}

mutation AdminSaveCompanyRole($companyId: Int!, $input: CssSaveCompanyRoleInput!) {
  cssAdminSaveCompanyRole(company_id: $companyId, input: $input) {
    role_id
    name
    sort_order
    allowed_resources
    user_count
    manageable
  }
}

mutation AdminDeleteCompanyRole($companyId: Int!, $roleId: Int!) {
  cssAdminDeleteCompanyRole(company_id: $companyId, role_id: $roleId)
}

mutation AdminAddCompanyUser($companyId: Int!, $input: CssAdminAddCompanyUserInput!) {
  cssAdminAddCompanyUser(company_id: $companyId, input: $input) {
    user_id
    customer_id
    email
  }
}

mutation AdminUpdateCompanyUser($companyId: Int!, $input: CssAdminUpdateCompanyUserInput!) {
  cssAdminUpdateCompanyUser(company_id: $companyId, input: $input) {
    user_id
    customer_id
    email
  }
}

mutation AdminRemoveCompanyUser($companyId: Int!, $userId: Int!) {
  cssAdminRemoveCompanyUser(company_id: $companyId, user_id: $userId)
}

# The other Admin areas remain availability probes until their focused slices.
query AdminCompanyOtherManagementAvailability($companyId: Int!) {
  catalog: css_admin_company_catalog_policy(company_id: $companyId) { __typename }
  purchase_controls: css_admin_purchase_controls(company_id: $companyId) { __typename }
  commercial: css_admin_company_payment_configuration(company_id: $companyId) { __typename }
  credit_orders: css_admin_credit_orders(company_id: $companyId, currentPage: 1, pageSize: 1) { __typename }
}
