name: Employee Purchase Controls Validation

on:
  push:
    branches:
      - feature/employee-purchase-controls-tiered-limits-20260920
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAGENTO_BASE_URL: https://staging.example.com
      MAGENTO_STORE_CODE: default
      CSS_STORE_URL: https://store.csscdn.co.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Focused tests
        run: |
          node --test tests/purchase-controls.test.mjs
          node --test tests/purchase-control-modals.test.mjs
          node --test tests/admin-interaction-polish.test.mjs
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Build
        run: yarn build
