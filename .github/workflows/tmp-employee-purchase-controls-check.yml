name: Temporary Employee Purchase Controls Check

on:
  push:
    branches:
      - feature/employee-purchase-controls-tiered-limits-20260920

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Focused purchase-control tests
        run: |
          node --test tests/purchase-controls.test.mjs
          node --test tests/purchase-control-modals.test.mjs
          node --test tests/admin-interaction-polish.test.mjs
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
